name: "🐞 Bug report"
description: Report a reproducible bug with steps, expected behavior, and environment details.
title: "[Bug]: title "
labels: ["Bug", "Needs Triage"]
assignees: "p0w3rsh3ll"

body:
  - type: markdown
    attributes:
      value: |
        Please fill out the following template.

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the exact steps to reproduce the issue.
      placeholder: |
        ```powershell
        # Add your reproduction steps here
        ```
      render: powershell
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen? A concise description of what you expected to happen.
      placeholder: |
        ```none
        ```
      render: text
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Current behavior
      description: What actually happened? A concise description of what you're experiencing.
      placeholder: |
        ```none
        ```
      render: text
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment data
      description: Provide the output of `$PSVersionTable`.
      placeholder: |
        ```powershell
        > $PSVersionTable
        ```
      render: powershell
    validations:
      required: false

  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Links? References? Anything that will give us more context about the issue you are encountering!

        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false
