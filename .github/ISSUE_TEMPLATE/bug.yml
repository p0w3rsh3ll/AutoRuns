name: Bug Report
description: Report a reproducible bug with steps, expected behavior, and environment details.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this is a bug report, please fill out the following template.
        If it's not a bug, feel free to remove the template and describe the issue in your own words.

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the exact steps to reproduce the issue.
      placeholder: |
        ```powershell
        # Add your reproduction steps here
        ```
      render: powershell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: |
        ```none
        ```
      render: text
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
      placeholder: |
        ```none
        ```
      render: text
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment data
      description: Provide the output of `$PSVersionTable`.
      placeholder: |
        ```powershell
        > $PSVersionTable
        ```
      render: powershell
    validations:
      required: true
